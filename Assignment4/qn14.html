<!DOCTYPE html>
<html>
<head>
  
  <style>
    .card {
      width: 300px;
      height: 200px;
      position: relative; 
      border: 1px solid black;
      padding: 10px;
    }
    .label {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: red;
      color: white;
      padding: 2px 6px;
      font-size: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>CSS Fundamentals</h2>
    <p>Learn how to style and arrange web pages.</p>
    <span class="label">NEW</span>
  </div>
</body>
</html>
