<!DOCTYPE html>
<html>
    <head>
        <style>
            .student-cards {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 20px;
            }
    .card {
        border: 1px solid black;
        padding: 15px;
        text-align: center;
    }
        </style>
    </head>
    <body>
        <div class="student-cards">
            <div class="card">Student 1</div>
            <div class="card">Student 2</div>
            <div class="card">Student 3</div>
            <div class="card">Student 4</div>
        </div>
    </body>
</html>
