<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1.0">
	<title>Question 9</title>
	<style>
	.grid{
		display:grid;
		grid-template-columns:repeat(3,1fr);
		gap:20px;
		}
	.grid div{	
		align-items:center;
		justify-content:center;
		padding:20px;
		border: 1px solid;
		display:flex;
		}
	</style>
</head>
<body>
	<div class="grid">
	<div>One</div>
	<div>Two</div>
	<div>Three</div>
	<div>Four</div>
	<div>Five</div>
	<div>Six</div>
	</div>
</body>
</html>
