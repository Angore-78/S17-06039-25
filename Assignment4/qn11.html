<!DOCTYPE html>
<html>
    <head>
        <style>
            .container{
                display: flex;

            }
            .sidebar{
                width: 30%;
                background-color: rgb(90, 67, 67);
                padding: 10px;
            }
            .content{
                width: 70%;
                background-color: blue;
                padding: 10px;
            }
            @media (max-width:600px){
                .container{
                    flex-direction: column;
                } 
                .sidebar,.content{
                    width: 100%;
                }

                
            }
        </style>

    </head>
        <body>
            <div class="container">
                <div class="sidebar">
                    Sidebar
                </div>
                <div class="content">
                     Main Content
                    </div>
                </div>
        </body>
   
</html>
