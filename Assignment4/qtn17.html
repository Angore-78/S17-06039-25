<!DOCTYPE html>
<html >
<head>
 
  <style>
    .btn {
      background-color: #222;       
       color: white;                 
      padding: 12px 24px;         
      border: 1px solid black;    
      font-size: 16px;
      cursor: pointer;
      
      transition: background-color 0.3s ease, transform 0.3s ease;
    }

    .btn:hover {
      background-color: #555;     
      transform: scale(1.08);      
    }
  </style>
</head>
<body>
  <button class="btn">
    Hover Over Me
  </button>
</body>
</html>
